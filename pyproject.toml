[project]
name = "telegram-lead-manager"
version = "1.0.0"
description = "Защищённый API заявок и Telegram-бот администратора"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "aiogram>=3.20,<4",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
